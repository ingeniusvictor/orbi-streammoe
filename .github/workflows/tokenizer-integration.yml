name: tokenizer-integration

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - ".github/workflows/tokenizer-integration.yml"
      - "include/orbi/streammoe/tokenizer/**"
      - "src/tokenizer/**"
      - "tests/tokenizers_cpp_qwen_tokenizer_test.cpp"
      - "docs/OSM-37B-TOKENIZERS-CPP-ADAPTER.md"
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - ".github/workflows/tokenizer-integration.yml"
      - "include/orbi/streammoe/tokenizer/**"
      - "src/tokenizer/**"
      - "tests/tokenizers_cpp_qwen_tokenizer_test.cpp"
      - "docs/OSM-37B-TOKENIZERS-CPP-ADAPTER.md"

jobs:
  tokenizers-cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Configure optional tokenizer backend
        run: cmake -S . -B build-tokenizer -DORBI_STREAMMOE_BUILD_TESTS=ON -DORBI_STREAMMOE_ENABLE_TOKENIZERS_CPP=ON

      - name: Build tokenizer adapter test
        run: cmake --build build-tokenizer --config Release --target orbi_streammoe_tokenizers_cpp_qwen_tokenizer_tests

      - name: Test tokenizer adapter
        run: ctest --test-dir build-tokenizer -C Release -R orbi_streammoe_tokenizers_cpp_qwen_tokenizer_tests --output-on-failure -V
