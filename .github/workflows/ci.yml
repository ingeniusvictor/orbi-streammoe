name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OSM-39F missing-expert planner
        run: python scripts/test_qwen_missing_experts.py

      - name: Verify OSM-39F explicit expert selection
        run: python scripts/test_qwen_expert_range_selection.py

      - name: Verify OSM-40D missing dense row planner
        run: python scripts/test_qwen_dense_missing_rows.py

      - name: Verify OSM-40D dense stream inventory builder
        run: python scripts/test_qwen_dense_stream_inventory.py

      - name: Verify OSM-40D dense tooling syntax
        run: python -m py_compile scripts/build_qwen_dense_stream_inventory.py scripts/plan_qwen_missing_dense_rows.py scripts/fetch_qwen_dense_row_plan.py

      - name: Verify OSM-40E production dense controller
        run: python scripts/test_qwen_dense_controller.py

      - name: Verify OSM-40E controller syntax
        run: python -m py_compile scripts/run_qwen_dense_conversion.py scripts/test_qwen_dense_controller.py

      - name: Verify OSM-41A production execution manifest
        run: python scripts/test_qwen_production_execution.py

      - name: Verify OSM-41A tooling syntax
        run: python -m py_compile scripts/plan_qwen_production_execution.py scripts/test_qwen_production_execution.py

      - name: Verify OSM-41B restart-safe operator runner
        run: python scripts/test_qwen_production_operator.py

      - name: Verify OSM-41B tooling syntax
        run: python -m py_compile scripts/run_qwen_production_operator.py scripts/test_qwen_production_operator.py

      - name: Verify OSM-41C production expert controller
        run: python scripts/test_qwen_expert_controller.py

      - name: Verify OSM-41C tooling syntax
        run: python -m py_compile scripts/run_qwen_expert_conversion.py scripts/test_qwen_expert_controller.py

      - name: Verify OSM-41D production command builder
        run: python scripts/test_qwen_production_commands.py

      - name: Verify OSM-41D tooling syntax
        run: python -m py_compile scripts/build_qwen_production_commands.py scripts/test_qwen_production_commands.py

      - name: Verify OSM-41E one-command production launcher
        run: python scripts/test_qwen_production_launcher.py

      - name: Verify OSM-41E tooling syntax
        run: python -m py_compile scripts/launch_qwen_production.py scripts/test_qwen_production_launcher.py

      - name: Verify OSM-41F production execution receipts
        run: python scripts/test_qwen_production_receipts.py

      - name: Verify OSM-41F tooling syntax
        run: python -m py_compile scripts/record_qwen_production_receipts.py scripts/test_qwen_production_receipts.py

      - name: Verify OSM-42A official production rehearsal
        run: python scripts/test_qwen_production_rehearsal.py

      - name: Verify OSM-42A tooling syntax
        run: python -m py_compile scripts/rehearse_qwen_production.py scripts/test_qwen_production_rehearsal.py

      - name: Verify OSM-42B Windows hardware preflight
        run: python scripts/test_qwen_windows_preflight.py

      - name: Verify OSM-42B tooling syntax
        run: python -m py_compile scripts/probe_qwen_windows_host.py scripts/authorize_qwen_windows_conversion.py scripts/test_qwen_windows_preflight.py

      - name: Exercise native Windows OSM-42B host probe
        if: runner.os == 'Windows'
        run: python scripts/probe_qwen_windows_host.py --target-output build/osm42b/checkpoint --expert-work build/osm42b/expert-work --dense-work build/osm42b/dense-work --output build/osm42b/windows-host-probe.json --allow-missing-vulkan

      - name: Verify OSM-42C guarded Windows start
        run: python scripts/test_qwen_windows_guarded_start.py

      - name: Verify OSM-42C tooling syntax
        run: python -m py_compile scripts/guard_qwen_windows_start.py scripts/test_qwen_windows_guarded_start.py

      - name: Verify OSM-42D Windows conversion evidence
        run: python scripts/test_qwen_windows_conversion_evidence.py

      - name: Verify OSM-42D tooling syntax
        run: python -m py_compile scripts/certify_qwen_windows_conversion.py scripts/test_qwen_windows_conversion_evidence.py

      - name: Verify OSM-43A official runtime load gate
        run: python scripts/test_qwen_runtime_load_gate.py

      - name: Verify OSM-43A tooling syntax
        run: python -m py_compile scripts/certify_qwen_runtime_load.py scripts/test_qwen_runtime_load_gate.py

      - name: Verify OSM-43B official first-token gate
        run: python scripts/test_qwen_first_token_gate.py

      - name: Verify OSM-43B tooling syntax
        run: python -m py_compile scripts/certify_qwen_first_token.py scripts/test_qwen_first_token_gate.py

      - name: Verify OSM-43C official text first-token gate
        run: python scripts/test_qwen_text_first_token_gate.py

      - name: Verify OSM-43C tooling syntax
        run: python -m py_compile scripts/certify_qwen_text_first_token.py scripts/test_qwen_text_first_token_gate.py

      - name: Verify OSM-43D bounded multi-token generation gate
        run: python scripts/test_qwen_bounded_generation_gate.py

      - name: Verify OSM-43D tooling syntax
        run: python -m py_compile scripts/certify_qwen_bounded_generation.py scripts/test_qwen_bounded_generation_gate.py

      - name: Verify OSM-44A tooling syntax
        run: python -m py_compile scripts/qwen_chat_template_reference.py scripts/test_qwen_chat_template_contract.py

      - name: Verify OSM-44C chat-formatted bounded generation gate
        run: python scripts/test_qwen_chat_generation_gate.py

      - name: Verify OSM-44C tooling syntax
        run: python -m py_compile scripts/certify_qwen_chat_generation.py scripts/test_qwen_chat_generation_gate.py

      - name: Verify OSM-45A performance instrumentation
        run: python scripts/test_qwen_chat_performance.py

      - name: Verify OSM-45A tooling syntax
        run: python -m py_compile scripts/measure_qwen_chat_performance.py scripts/test_qwen_chat_performance.py

      - name: Verify OSM-45B phase latency certification
        run: python scripts/test_qwen_phase_latency.py

      - name: Verify OSM-45B tooling syntax
        run: python -m py_compile scripts/certify_qwen_phase_latency.py scripts/test_qwen_phase_latency.py

      - name: Install Linux Vulkan software driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools glslang-tools

      - name: Verify pinned RMSNorm SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/rmsnorm.comp.spv \
            shaders/rmsnorm.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/rmsnorm.comp.spv \
            /tmp/orbi-shaders/rmsnorm_spv.hpp \
            --symbol kRmsNormSpirv
          diff -u \
            include/orbi/streammoe/generated/rmsnorm_spv.hpp \
            /tmp/orbi-shaders/rmsnorm_spv.hpp

      - name: Verify pinned Q4 dequant SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/q4_dequant.comp.spv \
            shaders/q4_dequant.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/q4_dequant.comp.spv \
            /tmp/orbi-shaders/q4_dequant_spv.hpp \
            --symbol kQ4DequantSpirv
          diff -u \
            include/orbi/streammoe/generated/q4_dequant_spv.hpp \
            /tmp/orbi-shaders/q4_dequant_spv.hpp

      - name: Verify pinned Q4 GEMV SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/q4_gemv.comp.spv \
            shaders/q4_gemv.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/q4_gemv.comp.spv \
            /tmp/orbi-shaders/q4_gemv_spv.hpp \
            --symbol kQ4GemvSpirv
          diff -u \
            include/orbi/streammoe/generated/q4_gemv_spv.hpp \
            /tmp/orbi-shaders/q4_gemv_spv.hpp

      - name: Verify pinned SwiGLU SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/swiglu.comp.spv \
            shaders/swiglu.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/swiglu.comp.spv \
            /tmp/orbi-shaders/swiglu_spv.hpp \
            --symbol kSwiGluSpirv
          diff -u \
            include/orbi/streammoe/generated/swiglu_spv.hpp \
            /tmp/orbi-shaders/swiglu_spv.hpp

      - name: Verify pinned weighted accumulate SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/weighted_accumulate.comp.spv \
            shaders/weighted_accumulate.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/weighted_accumulate.comp.spv \
            /tmp/orbi-shaders/weighted_accumulate_spv.hpp \
            --symbol kWeightedAccumulateSpirv
          diff -u \
            include/orbi/streammoe/generated/weighted_accumulate_spv.hpp \
            /tmp/orbi-shaders/weighted_accumulate_spv.hpp

      - name: Configure
        run: cmake -S . -B build -DORBI_STREAMMOE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify real Vulkan compute execution
        if: runner.os == 'Linux'
        env:
          ORBI_REQUIRE_VULKAN_COMPUTE: 1
        run: |
          vulkaninfo --summary
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_compute_roundtrip_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_rmsnorm_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_q4_dequant_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_q4_gemv_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_qpack_expert_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_qpack_metadata_dtype_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_qpack_expert_mlp_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_swiglu_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_float_buffer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_persistent_ops_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_preloaded_q4_weights_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_resident_expert_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_resident_output_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_weighted_accumulate_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_resident_expert_cache_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_weighted_routed_moe_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_routed_moe_accumulate_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_shared_expert_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_sparse_moe_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_moe_sublayer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_gqa_sublayer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_full_attention_decoder_layer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_decoder_layer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_decoder_stack_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_model_shell_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_greedy_token_session_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_greedy_text_session_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_deltanet_sublayer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_linear_decoder_layer_tests --output-on-failure -V
