name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Vulkan software driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools glslang-tools

      - name: Generate RMSNorm SPIR-V preview
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0             -o /tmp/orbi-shaders/rmsnorm.comp.spv             shaders/rmsnorm.comp
          python3 scripts/embed_spirv.py             /tmp/orbi-shaders/rmsnorm.comp.spv             /tmp/orbi-shaders/rmsnorm_spv.hpp             --symbol kRmsNormSpirv
          echo ORBI_RMSNORM_HEADER_BEGIN
          cat /tmp/orbi-shaders/rmsnorm_spv.hpp
          echo ORBI_RMSNORM_HEADER_END

      - name: Configure
        run: cmake -S . -B build -DORBI_STREAMMOE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify real Vulkan compute execution
        if: runner.os == 'Linux'
        env:
          ORBI_REQUIRE_VULKAN_COMPUTE: 1
        run: |
          vulkaninfo --summary
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_compute_roundtrip_tests --output-on-failure -V
