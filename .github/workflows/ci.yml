name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portable-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OSM-39F missing-expert planner
        run: python scripts/test_qwen_missing_experts.py

      - name: Verify OSM-39F explicit expert selection
        run: python scripts/test_qwen_expert_range_selection.py

      - name: Verify OSM-40D missing dense row planner
        run: python scripts/test_qwen_dense_missing_rows.py

      - name: Verify OSM-40D dense stream inventory builder
        run: python scripts/test_qwen_dense_stream_inventory.py

      - name: Verify OSM-40D dense tooling syntax
        run: python -m py_compile scripts/build_qwen_dense_stream_inventory.py scripts/plan_qwen_missing_dense_rows.py scripts/fetch_qwen_dense_row_plan.py

      - name: Install Linux Vulkan software driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools glslang-tools

      - name: Verify pinned RMSNorm SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/rmsnorm.comp.spv \
            shaders/rmsnorm.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/rmsnorm.comp.spv \
            /tmp/orbi-shaders/rmsnorm_spv.hpp \
            --symbol kRmsNormSpirv
          diff -u \
            include/orbi/streammoe/generated/rmsnorm_spv.hpp \
            /tmp/orbi-shaders/rmsnorm_spv.hpp

      - name: Verify pinned Q4 dequant SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/q4_dequant.comp.spv \
            shaders/q4_dequant.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/q4_dequant.comp.spv \
            /tmp/orbi-shaders/q4_dequant_spv.hpp \
            --symbol kQ4DequantSpirv
          diff -u \
            include/orbi/streammoe/generated/q4_dequant_spv.hpp \
            /tmp/orbi-shaders/q4_dequant_spv.hpp

      - name: Verify pinned Q4 GEMV SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/q4_gemv.comp.spv \
            shaders/q4_gemv.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/q4_gemv.comp.spv \
            /tmp/orbi-shaders/q4_gemv_spv.hpp \
            --symbol kQ4GemvSpirv
          diff -u \
            include/orbi/streammoe/generated/q4_gemv_spv.hpp \
            /tmp/orbi-shaders/q4_gemv_spv.hpp

      - name: Verify pinned SwiGLU SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/swiglu.comp.spv \
            shaders/swiglu.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/swiglu.comp.spv \
            /tmp/orbi-shaders/swiglu_spv.hpp \
            --symbol kSwiGluSpirv
          diff -u \
            include/orbi/streammoe/generated/swiglu_spv.hpp \
            /tmp/orbi-shaders/swiglu_spv.hpp

      - name: Verify pinned weighted accumulate SPIR-V
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/orbi-shaders
          glslangValidator -V --target-env vulkan1.0 \
            -o /tmp/orbi-shaders/weighted_accumulate.comp.spv \
            shaders/weighted_accumulate.comp
          python3 scripts/embed_spirv.py \
            /tmp/orbi-shaders/weighted_accumulate.comp.spv \
            /tmp/orbi-shaders/weighted_accumulate_spv.hpp \
            --symbol kWeightedAccumulateSpirv
          diff -u \
            include/orbi/streammoe/generated/weighted_accumulate_spv.hpp \
            /tmp/orbi-shaders/weighted_accumulate_spv.hpp

      - name: Configure
        run: cmake -S . -B build -DORBI_STREAMMOE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify real Vulkan compute execution
        if: runner.os == 'Linux'
        env:
          ORBI_REQUIRE_VULKAN_COMPUTE: 1
        run: |
          vulkaninfo --summary
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_compute_roundtrip_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_rmsnorm_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_q4_dequant_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_q4_gemv_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_qpack_expert_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_qpack_metadata_dtype_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_qpack_expert_mlp_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_swiglu_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_float_buffer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_persistent_ops_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_preloaded_q4_weights_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_resident_expert_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_resident_output_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_weighted_accumulate_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_resident_expert_cache_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_weighted_routed_moe_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_routed_moe_accumulate_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_vulkan_shared_expert_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_sparse_moe_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_moe_sublayer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_gqa_sublayer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_full_attention_decoder_layer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_decoder_layer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_decoder_stack_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_model_shell_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_greedy_token_session_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_greedy_text_session_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_deltanet_sublayer_tests --output-on-failure -V
          ctest --test-dir build -C Release -R orbi_streammoe_checkpoint_linear_decoder_layer_tests --output-on-failure -V
