name: checkpoint-metadata

on:
  pull_request:
  push:
    branches: [main]

jobs:
  official-qwen-metadata:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned official checkpoint metadata
        run: python scripts/fetch_qwen_checkpoint_metadata.py --output build/qwen-official-metadata

      - name: Fetch strict official safetensors shard headers
        run: python scripts/fetch_qwen_shard_headers.py --metadata-dir build/qwen-official-metadata --output build/qwen-official-range-manifest.json

      - name: Fetch OSM-39F dynamic expert header manifest
        run: python scripts/fetch_qwen_shard_headers.py --metadata-dir build/qwen-official-metadata --output build/qwen-osm39f-dynamic-range.json --layer 0 --experts 2

      - name: Verify OSM-39F dynamic expert header manifest
        run: python scripts/test_qwen_dynamic_header_manifest.py build/qwen-osm39f-dynamic-range.json 2

      - name: Fetch bounded official BF16 conversion slice
        run: python scripts/fetch_qwen_conversion_slice.py --range-manifest build/qwen-official-range-manifest.json --output-dir build/qwen-official-conversion-slice

      - name: Fetch bounded official single expert
        run: python scripts/fetch_qwen_single_expert.py --range-manifest build/qwen-official-range-manifest.json --output-dir build/qwen-official-single-expert

      - name: Fetch bounded official two-expert range
        run: python scripts/fetch_qwen_expert_range.py --range-manifest build/qwen-official-range-manifest.json --output-dir build/qwen-official-expert-range --layer 0 --first-expert 0 --count 2

      - name: Fetch bounded official dense/global pilot
        run: python scripts/fetch_qwen_dense_pilot.py --range-manifest build/qwen-official-range-manifest.json --output-dir build/qwen-official-dense-pilot

      - name: Fetch bounded official global matrix rows
        run: python scripts/fetch_qwen_global_row_chunks.py --range-manifest build/qwen-official-range-manifest.json --output-dir build/qwen-official-global-rows --rows 2

      - name: Configure
        run: cmake -S . -B build/cmake -DORBI_STREAMMOE_BUILD_TESTS=ON

      - name: Build official checkpoint probes
        run: cmake --build build/cmake --config Release --target orbi_streammoe_official_checkpoint_metadata_tests orbi_streammoe_official_shard_range_tests orbi_streammoe_official_conversion_slice_tests orbi_streammoe_official_qpack_conversion_plan_tests orbi_streammoe_official_qpack_expert_geometry_tests orbi_streammoe_official_single_expert_conversion_tests orbi_streammoe_official_multi_expert_conversion_tests orbi_streammoe_official_qpack_package_plan_tests orbi_streammoe_official_dense_conversion_tests orbi_streammoe_official_streamed_global_rows_tests orbi_streammoe_qpack_list_dense_sources

      - name: Verify official Qwen checkpoint metadata
        run: build/cmake/Release/orbi_streammoe_official_checkpoint_metadata_tests.exe build/qwen-official-metadata
        if: runner.os == 'Windows'

      - name: Verify official Qwen checkpoint metadata
        run: build/cmake/orbi_streammoe_official_checkpoint_metadata_tests build/qwen-official-metadata
        if: runner.os == 'Linux'

      - name: Verify official Qwen shard header ranges
        run: build/cmake/Release/orbi_streammoe_official_shard_range_tests.exe build/qwen-official-metadata build/qwen-official-range-manifest.json
        if: runner.os == 'Windows'

      - name: Verify official Qwen shard header ranges
        run: build/cmake/orbi_streammoe_official_shard_range_tests build/qwen-official-metadata build/qwen-official-range-manifest.json
        if: runner.os == 'Linux'

      - name: Verify official Qwen BF16 conversion slice
        run: build/cmake/Release/orbi_streammoe_official_conversion_slice_tests.exe build/qwen-official-conversion-slice
        if: runner.os == 'Windows'

      - name: Verify official Qwen BF16 conversion slice
        run: build/cmake/orbi_streammoe_official_conversion_slice_tests build/qwen-official-conversion-slice
        if: runner.os == 'Linux'

      - name: Verify official QPACK conversion plan
        run: build/cmake/Release/orbi_streammoe_official_qpack_conversion_plan_tests.exe build/qwen-official-metadata
        if: runner.os == 'Windows'

      - name: Verify official QPACK conversion plan
        run: build/cmake/orbi_streammoe_official_qpack_conversion_plan_tests build/qwen-official-metadata
        if: runner.os == 'Linux'

      - name: Verify official QPACK expert geometry
        run: build/cmake/Release/orbi_streammoe_official_qpack_expert_geometry_tests.exe build/qwen-official-metadata
        if: runner.os == 'Windows'

      - name: Verify official QPACK expert geometry
        run: build/cmake/orbi_streammoe_official_qpack_expert_geometry_tests build/qwen-official-metadata
        if: runner.os == 'Linux'

      - name: Verify official bounded single-expert conversion
        run: build/cmake/Release/orbi_streammoe_official_single_expert_conversion_tests.exe build/qwen-official-metadata build/qwen-official-single-expert
        if: runner.os == 'Windows'

      - name: Verify official bounded single-expert conversion
        run: build/cmake/orbi_streammoe_official_single_expert_conversion_tests build/qwen-official-metadata build/qwen-official-single-expert
        if: runner.os == 'Linux'

      - name: Verify official bounded multi-expert conversion
        run: build/cmake/Release/orbi_streammoe_official_multi_expert_conversion_tests.exe build/qwen-official-metadata build/qwen-official-expert-range
        if: runner.os == 'Windows'

      - name: Verify official bounded multi-expert conversion
        run: build/cmake/orbi_streammoe_official_multi_expert_conversion_tests build/qwen-official-metadata build/qwen-official-expert-range
        if: runner.os == 'Linux'

      - name: Verify official QPACK expert package plan
        run: build/cmake/Release/orbi_streammoe_official_qpack_package_plan_tests.exe build/qwen-official-metadata
        if: runner.os == 'Windows'

      - name: Verify official QPACK expert package plan
        run: build/cmake/orbi_streammoe_official_qpack_package_plan_tests build/qwen-official-metadata
        if: runner.os == 'Linux'

      - name: Verify official bounded dense/global conversion
        run: build/cmake/Release/orbi_streammoe_official_dense_conversion_tests.exe build/qwen-official-metadata build/qwen-official-dense-pilot
        if: runner.os == 'Windows'

      - name: Verify official bounded dense/global conversion
        run: build/cmake/orbi_streammoe_official_dense_conversion_tests build/qwen-official-metadata build/qwen-official-dense-pilot
        if: runner.os == 'Linux'

      - name: Verify official streamed global matrix rows
        run: build/cmake/Release/orbi_streammoe_official_streamed_global_rows_tests.exe build/qwen-official-metadata build/qwen-official-global-rows
        if: runner.os == 'Windows'

      - name: Verify official streamed global matrix rows
        run: build/cmake/orbi_streammoe_official_streamed_global_rows_tests build/qwen-official-metadata build/qwen-official-global-rows
        if: runner.os == 'Linux'

      - name: Emit official OSM-40D dense source inventory
        run: build/cmake/Release/orbi_streammoe_qpack_list_dense_sources.exe build/qwen-official-metadata build/qwen-official-dense-sources.json
        if: runner.os == 'Windows'

      - name: Emit official OSM-40D dense source inventory
        run: build/cmake/orbi_streammoe_qpack_list_dense_sources build/qwen-official-metadata build/qwen-official-dense-sources.json
        if: runner.os == 'Linux'

      - name: Verify official OSM-40D dense source inventory
        run: python scripts/test_qwen_dense_source_inventory.py build/qwen-official-dense-sources.json

      - name: Fetch official production dense tensor headers
        run: python scripts/fetch_qwen_shard_headers.py --metadata-dir build/qwen-official-metadata --tensor-list-json build/qwen-official-dense-sources.json --output build/qwen-official-production-ranges.json

      - name: Build official dense stream inventory
        run: python scripts/build_qwen_dense_stream_inventory.py --dense-sources-json build/qwen-official-dense-sources.json --range-manifest build/qwen-official-production-ranges.json --output build/qwen-official-dense-stream-inventory.json

      - name: Rehearse OSM-42A production operator
        if: runner.os == 'Windows'
        run: python scripts/rehearse_qwen_production.py --metadata-dir build/qwen-official-metadata --dense-inventory build/qwen-official-dense-stream-inventory.json --expert-slice-dir build/qwen-official-expert-range --dense-slice-dir build/qwen-official-dense-pilot --output-dir build/qwen-osm42a-rehearsal --bin-dir build/cmake/Release

      - name: Rehearse OSM-42A production operator
        if: runner.os == 'Linux'
        run: python scripts/rehearse_qwen_production.py --metadata-dir build/qwen-official-metadata --dense-inventory build/qwen-official-dense-stream-inventory.json --expert-slice-dir build/qwen-official-expert-range --dense-slice-dir build/qwen-official-dense-pilot --output-dir build/qwen-osm42a-rehearsal --bin-dir build/cmake

      - name: Upload OSM-42A rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: osm-42a-production-rehearsal-${{ runner.os }}
          path: build/qwen-osm42a-rehearsal
          if-no-files-found: error
